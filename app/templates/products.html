{% extends "base.html" %}

{% block title %}Katalog produktů | ERP{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Katalog produktů</h2>
</div>

<!-- HTMX form for adding products -->
 <form hx-post="/products-ui"
    hx-target="#products-table-body"
    hx-swap="beforeend"
    hx-on::after-request="this.reset()"
    class="mb-8 p-4 bg-gray-50 rounded-lg border border-gray-200 grid grid-cols-1 md:grid-cols-6 gap-3 items-end">

    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">SKU</label>
        <input type="text" name="sku" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="EL-004">
    </div>

    <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Název produktu</label>
        <input type="text" name="name" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Bezdrátová klásnice CZ">
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kategorie</label>
        <select name="category_id" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none bg:white">
            {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% else %}
                    <option value="1">Všeobecné</option>
                {% endfor %}
        </select>
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nákupní cena (Bez DPH)</label>
        <input type="number" step="0.01" name="purchase_price" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="500">
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Prodejní cena (Bez DPH)</label>
        <input type="number" step="0.01" name="selling_price" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="890">
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Sazba DPH</label>
        <input type="number" step="0.01" name="vat_rate" value="21" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-bluw-500 outline-none">
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Skladem (ks)</label>
        <input type="number" name="current_stock" value="0" required class="w-full rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Minimální zásoba (ks)</label>
        <input type="number" name="min_stock_level" value="5" required class="w-full rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Popis produktu</label>
        <input type="text" name="description" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Volitelný popis...">
    </div>


    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded text-sm transition">
        + přidat
    </button>
</form>

<!-- Table of products -->
 <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="bg-gray-100 border-b border-gray-200 text-gray-600 uppercase text-xs">
                <th class="py-3 px-4">ID</th>
                <th class="py-3 px-4">SKU</th>
                <th class="py-3 px-4">Název</th>
                <th class="py-3 px-4">Cena bez DPH</th>
                <th class="py-3 px-4">Skladem</th> 
            </tr>
        </thead>
        <tbody id="products-table-body" class="divide-y divide-gray-200">
            {% for product in products %}
                {% include "partials/product_row.html" %}
            {% else %}
            <tr>
                <td colspan="5" class="py-4 text-center text-gray-500">Žádné produkty nebyly nalezeny</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
 </div>
 {% endblock %}
