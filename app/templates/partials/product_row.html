<tr id="product-{{ product.id}}" class="hover:bg-gray-50 transition">
    <td class="py-3 px-4 text-sm font-medium text-gray-900">{{ product.id }}</td>
    <td class="py-3 px-4 text-sm text-gray-500 font-mono">{{ product.sku }}</td>
    <td class="py-3 px-4 text-sm font-semibold text-blue-600">{{ product.name }}</td>
    <td class="py-3 px-4 text-sm text-gray-700">{{ "%.2f"|format(product.selling_price) }} Kč</td>
    <td class="py-3 px-4 text-sm">
        {% if product.current_stock <= product.min_stock_level %}
            <span class="px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800" title="Minimální úroveň: {{ product.min_stock_level }} ks">
                {{ product.current_stock }} ks (Nízký stav!)
            </span>
        {% else %}
        <span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-geen-800">
            {{ product.current_stock }} ks
        </span>
        {% endif %}
    </td>
</tr>
