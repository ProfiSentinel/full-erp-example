<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Modulární ERP{% endblock %}</title>

    <!-- Tailwand CSS over CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX library -->
     <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="bg-slate-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Modulární ERP systém</h1>
            <div class="space-x-4">
                <a href="/products-ui" class="hover:text-blue-300 transition">Produkty</a>
                <a href="/docs" target="_blank" class="text-gray-400 hover:text-white transition">API Docs</a>
            </div>
        </div>
    </nav>

    <!-- Main content-->
    <main class="container mx-auto my-8 p-6 bg-white shadow-sm rounded-lg flex-1">
        {% block content %}{% endblock %}
    </main>

    <!--Footer-->
    <footer class="bg-gray-200 text-center py-4 text-sm text-gray-600">
        Modulární ERP System &copy; 2026
    </footer>
    
</body>
</html>
